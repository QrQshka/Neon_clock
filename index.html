<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Neon 7-Segment Clock Pro Max v4</title>
    <style>
        :root {
            --color-on: #00ff00;
            --color-off: #000a00;
            --glow-color: #00ff00;
            --brightness: 1;
            --glow-radius: 10px;
            --clock-scale: 1;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            gap: 5vw;
            transition: background-color 0.5s;
        }

        /* --- ПАНЕЛИ ИНТЕРФЕЙСА (С РЕЖИМОМ СКРЫТИЯ) --- */
        .sliders-panel, .right-panel {
            opacity: 1;
            pointer-events: auto;
            transition: opacity 0.4s ease, transform 0.4s ease;
            z-index: 10;
        }

        .sliders-panel.interface-hidden, .right-panel.interface-hidden {
            opacity: 0;
            pointer-events: none; /* Защита от случайных кликов по невидимым кнопкам */
        }

        /* --- ЛЕВАЯ ПАНЕЛЬ (СЛАЙДЕРЫ) --- */
        .sliders-panel {
            display: flex;
            gap: 25px;
        }

        .slider-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .slider-track-container {
            width: 30px;
            height: 180px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slider-track-container input[type=range] {
            width: 180px;
            transform: rotate(-90deg);
            position: absolute;
            -webkit-appearance: none;
            background: transparent;
            cursor: pointer;
        }

        .slider-track-container input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            background: #111;
            border-radius: 4px;
        }
        input[type=range]::-moz-range-track {
            width: 100%;
            height: 8px;
            background: #111;
            border-radius: 4px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            border-radius: 50%;
            margin-top: -7px;
            transition: background 0.3s ease, filter 0.3s ease;
        }
        input[type=range]::-moz-range-thumb {
            height: 22px;
            width: 22px;
            border-radius: 50%;
            border: none;
            transition: background 0.3s ease, filter 0.3s ease;
        }

        #scale::-webkit-slider-thumb { background: #666; filter: drop-shadow(0 0 5px rgba(255,255,255,0.3)); }
        #scale::-moz-range-thumb { background: #666; filter: drop-shadow(0 0 5px rgba(255,255,255,0.3)); }

        #brightness::-webkit-slider-thumb { 
            background: var(--color-on); 
            filter: drop-shadow(0 0 8px var(--color-on)) brightness(var(--brightness)); 
        }
        #brightness::-moz-range-thumb { 
            background: var(--color-on); 
            filter: drop-shadow(0 0 8px var(--color-on)) brightness(var(--brightness)); 
        }

        #glow::-webkit-slider-thumb { 
            background: var(--glow-color); 
            filter: drop-shadow(0 0 8px var(--glow-color)) brightness(var(--brightness)); 
        }
        #glow::-moz-range-thumb { 
            background: var(--glow-color); 
            filter: drop-shadow(0 0 8px var(--glow-color)) brightness(var(--brightness)); 
        }

        .slider-label {
            color: #666;
            font-size: 10px;
            letter-spacing: 1.5px;
            font-weight: bold;
        }

        /* --- ЦЕНТРАЛЬНАЯ ПАНЕЛЬ (ЧАСЫ) --- */
        .clock-wrapper {
            display: flex;
            align-items: center;
            gap: calc(18px * var(--clock-scale)); 
            cursor: pointer;
        }

        .digit {
            width: calc(90px * var(--clock-scale));
            height: calc(160px * var(--clock-scale));
            overflow: visible;
            transition: width 0.1s ease, height 0.1s ease;
        }

        .colon {
            width: calc(25px * var(--clock-scale));
            height: calc(160px * var(--clock-scale));
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: visible;
        }

        .seg, .dot {
            fill: var(--color-off);
            mix-blend-mode: screen; 
            filter: drop-shadow(0 0 0 transparent) brightness(1);
            transition: fill 0.2s ease, filter 0.8s ease-out;
            will-change: filter, fill;
            /* ДОБАВЛЕНО АППАРАТНОЕ УСКОРЕНИЕ ДЛЯ IOS */
            transform: translateZ(0); 
        }

        .seg.on, .dot.on {
            fill: var(--color-on);
            /* УПРОЩЕННЫЙ ФИЛЬТР ДЛЯ СВЕЧЕНИЯ НА ВСЕХ УСТРОЙСТВАХ */
            filter: drop-shadow(0 0 var(--glow-radius) var(--glow-color)) brightness(var(--brightness));
        }

        /* --- ПРАВАЯ ПАНЕЛЬ (ЦВЕТА) --- */
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .color-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .panel-title {
            color: #666;
            font-size: 10px;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .color-picker {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .color-tile {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid #222;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s, box-shadow 0.2s;
            box-shadow: inset 0 0 6px rgba(0,0,0,0.6);
        }

        .color-tile:hover {
            transform: scale(1.12);
            border-color: #aaa;
        }

        /* Выбранная плитка заметно крупнее и с подсветкой */
        .color-tile.active {
            transform: scale(1.22);
            border-color: #ffffff;
            box-shadow: 0 0 12px currentColor, inset 0 0 6px rgba(0,0,0,0.3);
            z-index: 2;
        }

        /* --- УВЕДОМЛЕНИЕ СИСТЕМЫ ЗАЩИТЫ --- */
        #fps-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(20, 20, 20, 0.9);
            color: #ffaa00;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 12px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 170, 0, 0.3);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            pointer-events: none;
        }
        #fps-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* --- АДАПТИВНОСТЬ ДЛЯ ТЕЛЕФОНОВ --- */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                justify-content: space-around;
                padding: 10px;
                gap: 5px;
            }
            .sliders-panel {
                flex-direction: row;
                gap: 15px;
            }
            .slider-track-container {
                height: 120px;
                width: 25px;
            }
            .slider-track-container input[type=range] {
                width: 120px;
            }
            .right-panel {
                flex-direction: row;
                gap: 20px;
            }
            .color-picker {
                grid-template-columns: repeat(9, 1fr);
                gap: 6px;
            }
            .color-tile {
                width: 26px;
                height: 26px;
            }
        }
    </style>
</head>
<body>

    <!-- Уведомление системы защиты -->
    <div id="fps-toast">⚠️ Защита системы: размер автоматически снижен для стабильности FPS</div>

    <!-- ЛЕВАЯ ПАНЕЛЬ -->
    <div class="sliders-panel" id="controls-left">
        <div class="slider-wrapper">
            <div class="slider-track-container">
                <input type="range" id="scale" min="0.1" max="1.9" step="0.05" value="1">
            </div>
            <div class="slider-label">РАЗМЕР</div>
        </div>
        <div class="slider-wrapper">
            <div class="slider-track-container">
                <input type="range" id="brightness" min="0.1" max="1.5" step="0.05" value="1">
            </div>
            <div class="slider-label">ЯРКОСТЬ</div>
        </div>
        <div class="slider-wrapper">
            <div class="slider-track-container">
                <input type="range" id="glow" min="0" max="20" step="1" value="10">
            </div>
            <div class="slider-label">СВЕЧЕНИЕ</div>
        </div>
    </div>

    <!-- ЦЕНТР (ЧАСЫ) -->
    <div class="clock-wrapper" id="clock-container">
        <svg class="digit" id="d0" viewBox="0 0 57 100">
            <polygon class="seg a" points="11,5 16,0 41,0 46,5 41,10 16,10" />
            <polygon class="seg b" points="47,11 52,16 52,41 47,46 42,41 42,16" />
            <polygon class="seg c" points="47,54 52,59 52,84 47,89 42,84 42,59" />
            <polygon class="seg d" points="11,95 16,100 41,100 46,95 41,90 16,90" />
            <polygon class="seg e" points="10,54 5,59 5,84 10,89 15,84 15,59" />
            <polygon class="seg f" points="10,11 5,16 5,41 10,46 15,41 15,16" />
            <polygon class="seg g" points="11,50 16,45 41,45 46,50 41,55 16,55" />
        </svg>
        <svg class="digit" id="d1" viewBox="0 0 57 100">
            <polygon class="seg a" points="11,5 16,0 41,0 46,5 41,10 16,10" />
            <polygon class="seg b" points="47,11 52,16 52,41 47,46 42,41 42,16" />
            <polygon class="seg c" points="47,54 52,59 52,84 47,89 42,84 42,59" />
            <polygon class="seg d" points="11,95 16,100 41,100 46,95 41,90 16,90" />
            <polygon class="seg e" points="10,54 5,59 5,84 10,89 15,84 15,59" />
            <polygon class="seg f" points="10,11 5,16 5,41 10,46 15,41 15,16" />
            <polygon class="seg g" points="11,50 16,45 41,45 46,50 41,55 16,55" />
        </svg>
        <svg class="colon" viewBox="0 0 20 100">
            <circle class="dot" cx="10" cy="32" r="7" />
            <circle class="dot" cx="10" cy="68" r="7" />
        </svg>
        <svg class="digit" id="d2" viewBox="0 0 57 100">
            <polygon class="seg a" points="11,5 16,0 41,0 46,5 41,10 16,10" />
            <polygon class="seg b" points="47,11 52,16 52,41 47,46 42,41 42,16" />
            <polygon class="seg c" points="47,54 52,59 52,84 47,89 42,84 42,59" />
            <polygon class="seg d" points="11,95 16,100 41,100 46,95 41,90 16,90" />
            <polygon class="seg e" points="10,54 5,59 5,84 10,89 15,84 15,59" />
            <polygon class="seg f" points="10,11 5,16 5,41 10,46 15,41 15,16" />
            <polygon class="seg g" points="11,50 16,45 41,45 46,50 41,55 16,55" />
        </svg>
        <svg class="digit" id="d3" viewBox="0 0 57 100">
            <polygon class="seg a" points="11,5 16,0 41,0 46,5 41,10 16,10" />
            <polygon class="seg b" points="47,11 52,16 52,41 47,46 42,41 42,16" />
            <polygon class="seg c" points="47,54 52,59 52,84 47,89 42,84 42,59" />
            <polygon class="seg d" points="11,95 16,100 41,100 46,95 41,90 16,90" />
            <polygon class="seg e" points="10,54 5,59 5,84 10,89 15,84 15,59" />
            <polygon class="seg f" points="10,11 5,16 5,41 10,46 15,41 15,16" />
            <polygon class="seg g" points="11,50 16,45 41,45 46,50 41,55 16,55" />
        </svg>
    </div>

    <!-- ПРАВАЯ ПАНЕЛЬ -->
    <div class="right-panel" id="controls-right">
        <div class="color-section">
            <div class="panel-title">ЦВЕТ ЦИФР</div>
            <div class="color-picker" id="picker-seg"></div>
        </div>
        <div class="color-section">
            <div class="panel-title">ЦВЕТ СВЕЧЕНИЯ</div>
            <div class="color-picker" id="picker-glow"></div>
        </div>
    </div>

    <script>
        // --- 1. ЛОГИКА ЧАСОВ И ИДЕАЛЬНОЕ МИГАНИЕ ДВОЕТОЧИЯ (0.5 сек горит, 0.5 сек нет) ---
        const segmentsMap = [
            ['a', 'b', 'c', 'd', 'e', 'f'],       // 0
            ['b', 'c'],                           // 1
            ['a', 'b', 'd', 'e', 'g'],            // 2
            ['a', 'b', 'c', 'd', 'g'],            // 3
            ['b', 'c', 'f', 'g'],                 // 4
            ['a', 'c', 'd', 'f', 'g'],            // 5
            ['a', 'c', 'd', 'e', 'f', 'g'],       // 6
            ['a', 'b', 'c'],                      // 7
            ['a', 'b', 'c', 'd', 'e', 'f', 'g'],  // 8
            ['a', 'b', 'c', 'd', 'f', 'g']        // 9
        ];

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const timeStr = h + m;

            for(let i = 0; i < 4; i++) {
                const digitVal = parseInt(timeStr[i]);
                const digitEl = document.getElementById('d' + i);
                
                digitEl.querySelectorAll('.seg').forEach(s => s.classList.remove('on'));
                segmentsMap[digitVal].forEach(className => {
                    digitEl.querySelector('.' + className).classList.add('on');
                });
            }
            
            // Мигание разделителя строго каждые 500 мс (0.5 сек горит, 0.5 сек нет)
            const dots = document.querySelectorAll('.dot');
            if (Math.floor(Date.now() / 500) % 2 === 0) {
                 dots.forEach(dot => dot.classList.add('on'));
            } else {
                 dots.forEach(dot => dot.classList.remove('on'));
            }
        }
        
        updateClock();
        setInterval(updateClock, 50); // Частая проверка для плавности


        // --- 2. СИСТЕМА АВТОМАТИЧЕСКОЙ ЗАЩИТЫ FPS ---
        let frameCount = 0;
        let lastTime = performance.now();
        let lowFpsCounter = 0;

        function monitorFPS(currentTime) {
            frameCount++;
            if (currentTime - lastTime >= 1000) {
                let fps = frameCount;
                frameCount = 0;
                lastTime = currentTime;

                // Если FPS просел ниже 35 кадров
                if (fps < 35) {
                    lowFpsCounter++;
                    if (lowFpsCounter >= 2) { // 2 секунды подряд лагов
                        triggerSystemProtection();
                        lowFpsCounter = 0;
                    }
                } else {
                    lowFpsCounter = Math.max(0, lowFpsCounter - 1);
                }
            }
            requestAnimationFrame(monitorFPS);
        }
        requestAnimationFrame(monitorFPS);

        function triggerSystemProtection() {
            const scaleInput = document.getElementById('scale');
            const glowInput = document.getElementById('glow');
            let currentScale = parseFloat(scaleInput.value);
            let currentGlow = parseFloat(glowInput.value);

            if (currentScale > 1.0) {
                scaleInput.value = Math.max(1.0, currentScale - 0.25).toFixed(2);
                scaleInput.dispatchEvent(new Event('input'));
                showToast("⚠️ Защита системы: размер уменьшен для стабильности FPS");
            } else if (currentGlow > 6) {
                glowInput.value = Math.max(6, currentGlow - 4).toFixed(0);
                glowInput.dispatchEvent(new Event('input'));
                showToast("⚠️ Защита системы: свечение уменьшено для стабильности FPS");
            }
        }

        function showToast(text) {
            const toast = document.getElementById('fps-toast');
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }


        // --- 3. ИНТЕРАКТИВ И СКРЫТИЕ ИНТЕРФЕЙСА (ZEN MODE) ---
     const leftPanel = document.getElementById('controls-left');
const rightPanel = document.getElementById('controls-right');

// Клик по фону скрывает/показывает интерфейс и включает полноэкранный режим
document.body.addEventListener('click', (e) => {
    if (e.target === document.body) {
        leftPanel.classList.toggle('interface-hidden');
        rightPanel.classList.toggle('interface-hidden');

        if (!document.fullscreenElement) {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }
    }
});

        // --- 4. УПРАВЛЕНИЕ СЛАЙДЕРАМИ И ЦВЕТАМИ ---
        const root = document.documentElement;
        
        document.getElementById('scale').addEventListener('input', (e) => {
            root.style.setProperty('--clock-scale', e.target.value);
        });
        document.getElementById('brightness').addEventListener('input', (e) => {
            root.style.setProperty('--brightness', e.target.value);
        });
        document.getElementById('glow').addEventListener('input', (e) => {
            root.style.setProperty('--glow-radius', e.target.value + 'px');
        });

        const colors = [
            '#00ff00', // Ярко-зеленый
            '#006600', // Темно-зеленый (по твоей просьбе)
            '#00ffff', // Циан
            '#0077ff', // Синий
            '#ff00ff', // Пурпурный
            '#ff0000', // Красный
            '#ff7700', // Оранжевый
            '#ffff00', // Желтый
            '#ffffff'  // Белый
        ];
        
        const pickerSeg = document.getElementById('picker-seg');
        const pickerGlow = document.getElementById('picker-glow');

        function getVeryDarkColor(hex) {
            if(hex.toLowerCase() === '#ffffff') return '#050505'; 
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            return `rgb(${Math.floor(r * 0.03)}, ${Math.floor(g * 0.03)}, ${Math.floor(b * 0.03)})`;
        }

        // Генерация палитры цифр
        colors.forEach((color, idx) => {
            let tile = document.createElement('div');
            tile.className = 'color-tile';
            tile.style.backgroundColor = color;
            if(idx === 0) tile.classList.add('active'); // Дефолтный выбор
            
            tile.addEventListener('click', (e) => {
                e.stopPropagation(); // чтобы клик по плитке не триггерил скрытие фона
                pickerSeg.querySelectorAll('.color-tile').forEach(t => t.classList.remove('active'));
                tile.classList.add('active');
                root.style.setProperty('--color-on', color);
                root.style.setProperty('--color-off', getVeryDarkColor(color));
            });
            pickerSeg.appendChild(tile);
        });

        // Генерация палитры свечения
        colors.forEach((color, idx) => {
            let tile = document.createElement('div');
            tile.className = 'color-tile';
            tile.style.backgroundColor = color;
            if(idx === 0) tile.classList.add('active'); // Дефолтный выбор
            
            tile.addEventListener('click', (e) => {
                e.stopPropagation();
                pickerGlow.querySelectorAll('.color-tile').forEach(t => t.classList.remove('active'));
                tile.classList.add('active');
                root.style.setProperty('--glow-color', color);
            });
            pickerGlow.appendChild(tile);
        });
    </script>
</body>
</html>
